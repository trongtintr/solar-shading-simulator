<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Shading & Daylight Simulator</title>
<!--
  Interactive Solar Shading and Daylighting Simulator — single-file build.
  External dependencies (loaded from jsDelivr CDN, ES modules):
    three@0.160.0  (3D rendering)            https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js
    three@0.160.0/examples/jsm/controls/OrbitControls.js
  Everything else (solar position, shading geometry, daylight, radiation, charts) is implemented below.
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#efede8; --panel:#ffffff; --ink:#1d232a; --muted:#69707a; --line:#dcd8d0; --soft:#f6f5f1;
  --accent:#2f5d8a; --sun:#e9a91b; --trans:#f07a22; --shade:#50627a; --bad:#b4442f; --good:#2f7a4f;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#1f262e;color:#eef1f4}
header h1{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0;white-space:nowrap}
header .loc{font-family:var(--mono);font-size:11.5px;color:#b9c3cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header button{background:#2e3843;color:#e8edf2;border:1px solid #3c4855;border-radius:4px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
header button:hover{background:#3a4654}
main{display:grid;grid-template-columns:330px minmax(380px,1fr) 470px;height:calc(100vh - 48px)}
#left,#right{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
#center{position:relative;min-width:0;display:flex;flex-direction:column}
#view3d{flex:1;position:relative;min-height:300px}
#view3d canvas{display:block;width:100%;height:100%}
#toolbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px}
#toolbar label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#toolbar select,#toolbar button{font-size:12px}
#statusBar{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;pointer-events:none;max-width:calc(100% - 20px)}
#legend3d{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:11px;pointer-events:none}
#legend3d i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#38414b;background:var(--soft);list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
details.sec[open]>summary:before{content:"▾"}
.secbody{padding:6px 12px 10px}
.row{margin:6px 0}
.row>label{display:flex;justify-content:space-between;font-size:12px;color:#39424c;margin-bottom:2px}
.row>label .u{color:var(--muted);font-family:var(--mono);font-size:11px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl input[type=time]{width:104px;font-family:var(--mono);font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl input[type=number]{width:78px;font-family:var(--mono);font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
select,input[type=date],input[type=text],textarea{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:3px 5px;background:#fff;color:var(--ink)}
.row select,.row input[type=date]{width:100%}
textarea{width:100%;font-family:var(--mono);font-size:11px;min-height:150px}
.hint{font-size:11px;color:var(--muted);margin:4px 0}
.warn{font-size:11.5px;color:var(--bad);margin:4px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--soft)} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:0;z-index:2}
#tabs button{flex:1;border:0;background:none;padding:9px 4px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none;padding:10px 12px 18px}
.pane.on{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#38414b;margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
h3:first-child{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:6px 7px}
.kpi .k{font-size:10.5px;color:var(--muted);line-height:1.2}
.kpi .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px}
.kpi .v small{font-size:10.5px;font-weight:400;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t td,table.t th{border-bottom:1px solid #ece9e3;padding:3px 4px;text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono)}
table.t th{font-weight:600;color:#47505a;background:var(--soft)}
table.t tr.diff td{background:#fff6dc}
.pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
canvas.chart{width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:#fff;margin:4px 0 8px}
.note{background:#f4f6f8;border-left:3px solid var(--accent);padding:6px 9px;font-size:11.5px;color:#3c4652;margin:8px 0}
.note.est{border-left-color:var(--sun)}
.cfglist .item{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--line);border-radius:4px;margin:4px 0;background:#fff}
.cfglist .item.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cfglist input[type=text]{width:100%}
.cfglist .ty{font-size:10.5px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0}
.prog>div{height:100%;background:var(--accent);width:0}
.method p,.method li{font-size:12px;line-height:1.5}
.method code{font-family:var(--mono);font-size:11px;background:var(--soft);padding:0 3px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1250px){ main{grid-template-columns:300px 1fr;height:auto} #right{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)} #center{height:70vh} #left{max-height:70vh} }
@media (max-width:760px){ main{grid-template-columns:1fr} #left{max-height:none} #center{height:60vh} header .loc{display:none} }
</style>
</head>
<body>
<header>
  <h1>Solar Shading &amp; Daylight Simulator</h1>
  <div class="loc" id="hdrLoc"></div>
  <button id="btnExportParams" title="Parameter table of all configurations (CSV)">Export parameters CSV</button>
  <button id="btnExportTS" title="Time-series from the last period / comparison run (CSV)">Export time-series CSV</button>
  <button id="btnExportRad" title="Radiance scene, sensor grid and run script for the active configuration">Export Radiance</button>
</header>
<main>
  <aside id="left"></aside>
  <section id="center">
    <div id="toolbar"></div>
    <div id="view3d"><div id="legend3d"></div><div id="statusBar"></div></div>
  </section>
  <aside id="right">
    <nav id="tabs"></nav>
    <div id="panes"></div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// =====================================================================
// CORE: solar geometry, shading geometry, daylight & radiation models
// Pure functions, no DOM. Units: metres, degrees, W/m², hours.
// World frame: ENU  (x = East, y = North, z = Up)
// Façade local frame: (t, w, n)  t = horizontal along façade (to the right
// when viewed from outside), w = up in façade plane, n = outward normal.
// Origin: façade base, horizontal centre, on the OUTER wall surface.
// Glazing plane: n = -reveal.  Devices live at n >= 0.
// =====================================================================
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const vlen = a => Math.hypot(a[0], a[1], a[2]);

// ---------------------------------------------------------------- time
function dayOfYear(y, m, d) { return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 864e5) + 1; }
function dateFromDoy(y, doy) { const t = new Date(Date.UTC(y, 0, doy)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
function daysInYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365; }
function nthSunday(y, m, n) {            // n >= 1, or -1 for last Sunday
  if (n > 0) { const wd = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); return 1 + ((7 - wd) % 7) + 7 * (n - 1); }
  const last = new Date(Date.UTC(y, m, 0)); return last.getUTCDate() - last.getUTCDay();
}
// Daylight-saving offset (h). Resolution: whole days (transition hour not modelled).
function dstOffset(rule, y, m, d) {
  const md = m * 100 + d;
  if (rule === 'EU') return md >= 300 + nthSunday(y, 3, -1) && md < 1000 + nthSunday(y, 10, -1) ? 1 : 0;
  if (rule === 'US') return md >= 300 + nthSunday(y, 3, 2) && md < 1100 + nthSunday(y, 11, 1) ? 1 : 0;
  if (rule === 'AU') return md >= 1000 + nthSunday(y, 10, 1) || md < 400 + nthSunday(y, 4, 1) ? 1 : 0;
  return 0;
}

// --------------------------------------------- NOAA solar position (Meeus)
function julianDay(y, m, d, hUT = 0) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5 + hUT / 24;
}
function solarCore(jd) {
  const T = (jd - 2451545) / 36525;
  const L0 = ((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360 + 360) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Mr = M * D2R;
  const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;
  const omega = 125.04 - 1934.136 * T;
  const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(omega * D2R)) * D2R;
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = (eps0 + 0.00256 * Math.cos(omega * D2R)) * D2R;
  const decl = Math.asin(Math.sin(eps) * Math.sin(lam)) * R2D;
  const yv = Math.tan(eps / 2) ** 2, L0r = L0 * D2R;
  const eot = 4 * R2D * (yv * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * yv * Math.sin(Mr) * Math.cos(2 * L0r)
    - 0.5 * yv * yv * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
  return { decl, eot, T };
}
function refraction(alt) {            // NOAA atmospheric refraction, degrees
  if (alt > 85) return 0;
  const te = Math.tan(alt * D2R);
  let r;
  if (alt > 5) r = 58.1 / te - 0.07 / te ** 3 + 0.000086 / te ** 5;
  else if (alt > -0.575) r = 1735 + alt * (-518.2 + alt * (103.4 + alt * (-12.79 + alt * 0.711)));
  else r = -20.772 / te;
  return r / 3600;
}
// site: {lat, lon, tz (h, standard time), dst rule}; clockH = local clock time (h)
function solarPosition(site, y, m, d, clockH, dstOverride) {
  const dst = dstOverride ?? dstOffset(site.dst, y, m, d);
  const ut = clockH - site.tz - dst;
  const jd = julianDay(y, m, d, 0) + ut / 24;
  const { decl, eot } = solarCore(jd);
  const tst = ((ut * 60 + eot + 4 * site.lon) % 1440 + 1440) % 1440;     // true solar time, min
  let ha = tst / 4 - 180; if (ha < -180) ha += 360;
  const la = site.lat * D2R, de = decl * D2R, h = ha * D2R;
  const cz = clamp(Math.sin(la) * Math.sin(de) + Math.cos(la) * Math.cos(de) * Math.cos(h), -1, 1);
  const altG = 90 - Math.acos(cz) * R2D;
  const alt = altG + refraction(altG);
  let az = Math.atan2(Math.sin(h), Math.cos(h) * Math.sin(la) - Math.tan(de) * Math.cos(la)) * R2D + 180;
  az = (az % 360 + 360) % 360;
  return { alt, altGeom: altG, az, decl, eot, ha, tst: tst / 60, dst, ut, jd };
}
// Sunrise / sunset / solar noon (local clock hours). Iterated NOAA method (zenith 90.833°).
function sunTimes(site, y, m, d) {
  const dst = dstOffset(site.dst, y, m, d), jd0 = julianDay(y, m, d, 0);
  let noon = 720 - 4 * site.lon;                                     // UTC minutes
  for (let i = 0; i < 2; i++) noon = 720 - 4 * site.lon - solarCore(jd0 + noon / 1440).eot;
  const event = sign => {
    let tUTC = noon, polar = null;
    for (let i = 0; i < 3; i++) {
      const { decl } = solarCore(jd0 + tUTC / 1440);
      const la = site.lat * D2R, de = decl * D2R;
      const arg = Math.cos(90.833 * D2R) / (Math.cos(la) * Math.cos(de)) - Math.tan(la) * Math.tan(de);
      if (arg > 1) { polar = 'night'; break; } if (arg < -1) { polar = 'day'; break; }
      const HA = Math.acos(arg) * R2D;
      tUTC = 720 - 4 * (site.lon + sign * HA) - solarCore(jd0 + tUTC / 1440).eot;
    }
    return { t: tUTC / 60 + site.tz + dst, polar };
  };
  const r = event(1), s = event(-1);
  const polar = r.polar || s.polar;
  return { sunrise: polar ? null : r.t, sunset: polar ? null : s.t, noon: noon / 60 + site.tz + dst, polar, dst,
    dayLength: polar ? (polar === 'day' ? 24 : 0) : s.t - r.t };
}
function sunVectorENU(alt, az) {
  const a = alt * D2R, z = az * D2R;
  return [Math.sin(z) * Math.cos(a), Math.cos(z) * Math.cos(a), Math.sin(a)];
}

// --------------------------------------------------------- façade frame
// azDeg: façade outward-normal azimuth, clockwise from North (S-facing = 180)
// tiltDeg: tilt from vertical, + = top leaning back (normal points upward)
function facadeFrame(azDeg, tiltDeg = 0) {
  const g = azDeg * D2R, a = tiltDeg * D2R, sg = Math.sin(g), cg = Math.cos(g), sa = Math.sin(a), ca = Math.cos(a);
  return { n: [sg * ca, cg * ca, sa], w: [-sg * sa, -cg * sa, ca], t: [-cg, sg, 0], nh: [sg, cg, 0], az: azDeg, tilt: tiltDeg };
}
const toLocal = (v, F) => [vdot(v, F.t), vdot(v, F.w), vdot(v, F.n)];
const toWorld = (p, F) => [p[0] * F.t[0] + p[1] * F.w[0] + p[2] * F.n[0], p[0] * F.t[1] + p[1] * F.w[1] + p[2] * F.n[1], p[0] * F.t[2] + p[1] * F.w[2] + p[2] * F.n[2]];
// Façade-relative angles from a local sun vector
function facadeAngles(sL) {
  return {
    incidence: Math.acos(clamp(sL[2], -1, 1)) * R2D,       // angle between sun and façade normal
    hsa: -Math.atan2(sL[0], sL[2]) * R2D,                     // horizontal shadow angle (+ = sun clockwise of normal in plan)
    vsa: Math.atan2(sL[1], sL[2]) * R2D,                      // vertical shadow (profile) angle
    front: sL[2] > 1e-6,
  };
}

// --------------------------------------------------------- oriented boxes
function rotAxes(rotT = 0, rotW = 0) {
  const a = rotT * D2R, ca = Math.cos(a), sa = Math.sin(a), b = rotW * D2R, cb = Math.cos(b), sb = Math.sin(b);
  const ax = [[1, 0, 0], [0, ca, sa], [0, -sa, ca]];                 // about t: + tilt lowers the outer (+n) edge
  return ax.map(v => [v[0] * cb + v[2] * sb, v[1], -v[0] * sb + v[2] * cb]);  // about w: + swings outer edge to +t
}
function makeBox(c, size, rotT = 0, rotW = 0, kind = 'device', tag = '') {
  return { c: c.slice(), h: [Math.abs(size[0]) / 2, Math.abs(size[1]) / 2, Math.abs(size[2]) / 2], ax: rotAxes(rotT, rotW), kind, tag };
}
const boxRange = (t0, t1, w0, w1, n0, n1, kind, tag) => makeBox([(t0 + t1) / 2, (w0 + w1) / 2, (n0 + n1) / 2], [t1 - t0, w1 - w0, n1 - n0], 0, 0, kind, tag);
function boxVerts(b) {
  const out = [];
  for (const i of [-1, 1]) for (const j of [-1, 1]) for (const k of [-1, 1])
    out.push([0, 1, 2].map(q => b.c[q] + i * b.h[0] * b.ax[0][q] + j * b.h[1] * b.ax[1][q] + k * b.h[2] * b.ax[2][q]));
  return out;
}
// Ray / oriented-box intersection (slab method). Returns entry distance or -1.
function rayBox(o, d, b) {
  let tmin = -Infinity, tmax = Infinity;
  const oc = [o[0] - b.c[0], o[1] - b.c[1], o[2] - b.c[2]];
  for (let i = 0; i < 3; i++) {
    const a = b.ax[i], p = oc[0] * a[0] + oc[1] * a[1] + oc[2] * a[2], q = d[0] * a[0] + d[1] * a[1] + d[2] * a[2], h = b.h[i];
    if (Math.abs(q) < 1e-12) { if (p < -h || p > h) return -1; continue; }
    let t1 = (-h - p) / q, t2 = (h - p) / q; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; }
    if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return -1;
  }
  if (tmax < 1e-7) return -1;
  return Math.max(tmin, 0);
}
function rayHitsAny(o, d, boxes) { for (const b of boxes) if (rayBox(o, d, b) >= 0) return true; return false; }
function rayFirstHit(o, d, boxes) { let best = Infinity, hb = null; for (const b of boxes) { const t = rayBox(o, d, b); if (t >= 0 && t < best) { best = t; hb = b; } } return hb ? { t: best, box: hb } : null; }

// --------------------------------------------------------- shading devices
const SHADING_TYPES = {
  none: 'No shading', overhang: 'Horizontal overhang', hlouver: 'Horizontal louvers', vfin: 'Vertical fins',
  combined: 'Combined louvers + fins', eggcrate: 'Egg-crate', blinds: 'Adjustable external blinds', custom: 'Custom geometry (JSON)'
};
function windowRect(g) { return { x0: -g.winW / 2, x1: g.winW / 2, y0: g.sill, y1: g.head }; }
// Analytic cut-off slat angle (zero-thickness slats): smallest tilt that blocks beam at profile angle phi
function cutoffAngle(slatW, spacing, phiDeg) {
  const phi = phiDeg * D2R, arg = clamp(spacing * Math.cos(phi) / slatW, -1, 1);
  return clamp((Math.asin(arg) - phi) * R2D, -60, 85);
}
function buildGeometry(cfg, sL) {
  const g = cfg.geom, W = windowRect(g), d = Math.max(0, g.reveal), dev = [], notes = [];
  const T = cfg.type, wW = W.x1 - W.x0, wH = W.y1 - W.y0, xc = (W.x0 + W.x1) / 2;
  let blindAngle = null;
  const addHL = p => {
    const n = Math.max(0, Math.round(p.count));
    for (let i = 0; i < n; i++) dev.push(makeBox([xc, W.y1 + p.start - i * p.spacing, p.proj + p.depth / 2], [wW + 2 * p.ext, p.thick, p.depth], p.tilt, 0, 'device', 'louver'));
  };
  const addVF = p => {
    const n = Math.max(0, Math.round(p.count)), y0 = W.y0 - p.ext, y1 = W.y1 + p.ext;

  { const P = 0.5, sL = local(45, 0), c = custom([{ t: 0, w: 2.5 + 0.0005, n: P / 2, dt: 1000, dw: 0.001, dn: P }]);

# Radiance workflow for the exported scene (requires Radiance 5.x: https://www.radiance-online.org)
# Note Radiance sign convention: longitude and meridian are POSITIVE WEST.
# 1) Daylight factor under CIE overcast sky (10 000 lux unobstructed horizontal)
gensky ${s.month} ${s.day} 12 -c -a ${s.lat} -o ${lonW} -m ${merW} -B 55.866 > sky_overcast.rad
cat >> sky_overcast.rad << 'EOF'
skyfunc glow sky_glow 0 0 4 1 1 1 0
sky_glow source sky 0 0 4 0 0 1 180
skyfunc glow ground_glow 0 0 4 1 1 1 0
ground_glow source ground 0 0 4 0 0 -1 180
EOF
oconv sky_overcast.rad scene.rad > scene_oc.oct
rtrace -I+ -h -ab 5 -aa 0.1 -ar 256 -ad 2048 -as 512 scene_oc.oct < grid.pts | rcalc -e '$1=179*(0.265*$1+0.670*$2+0.065*$3)/10000*100' > df_percent.txt
# 2) Point-in-time illuminance, CIE clear sky with sun for the selected date/time (local standard time ${hhmm(s.time - (state.ev?.sp.dst || 0))})
gensky ${s.month} ${s.day} ${(s.time - (state.ev?.sp.dst || 0)).toFixed(3)} +s -a ${s.lat} -o ${lonW} -m ${merW} > sky_clear.rad
cat >> sky_clear.rad << 'EOF'
skyfunc glow sky_glow 0 0 4 1 1 1 0
sky_glow source sky 0 0 4 0 0 1 180
skyfunc glow ground_glow 0 0 4 1 1 1 0
ground_glow source ground 0 0 4 0 0 -1 180
EOF
oconv sky_clear.rad scene.rad > scene_cl.oct
rtrace -I+ -h -ab 5 -aa 0.1 -ar 256 -ad 2048 -as 512 scene_cl.oct < grid.pts | rcalc -e '$1=179*(0.265*$1+0.670*$2+0.065*$3)' > lux_clear.txt
# 3) Annual sDA / ASE (IES LM-83): use the same scene + grid with an EPW in Honeybee-Radiance, e.g.
#    honeybee-radiance (Ladybug Tools) annual-daylight recipe, or Radiance rfluxmtx/dctimestep (2-phase) with gendaymtx on the EPW.
`;
  download('scene.rad', lines.join('\n'), 'text/plain'); setTimeout(() => download('grid.pts', pts.join('\n') + '\n', 'text/plain'), 300); setTimeout(() => download('run_radiance.sh', sh, 'text/plain'), 600);
}

// ============================================================ VALIDATION
function buildValidationPane() {
  const p = $('#tab-validation');
  p.append(el('div', { class: 'note' }, 'Automated checks of the solar-position algorithm against published reference values and of the shading engine against closed-form analytical cases. The same suite runs in Node for regression testing.'),
    el('button', { class: 'btn primary', onclick: () => { const R = runValidation(); const ok = R.filter(r => r.pass).length;
      $('#vOut').innerHTML = `<p><b class="${ok === R.length ? 'pass' : 'fail'}">${ok} / ${R.length} passed</b></p><table class="t"><tr><th>Group</th><th>Case</th><th class="n">Expected</th><th class="n">Computed</th><th class="n">Tol.</th><th></th></tr>` +
        R.map(r => `<tr><td>${r.group}</td><td>${r.name}</td><td class="n">${f(r.expected, 4)}</td><td class="n">${f(r.got, 4)}</td><td class="n">±${r.tol}</td><td class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</td></tr>`).join('') + '</table>'; } }, 'Run validation suite'),
    el('div', { id: 'vOut' }));
}
function buildMethodPane() {
  $('#tab-method').append(el('div', { class: 'method', html: `
<h3>Coordinate system & conventions</h3>
<ul><li>World frame ENU: x = East, y = North, z = Up (metres). The 3D view maps this to three.js as (x, z, −y).</li>
<li><b>Solar azimuth</b>: 0° = North, clockwise (E 90°, S 180°, W 270°). <b>Façade azimuth</b>: direction of the façade's outward normal, same convention (a south-facing façade = 180°). Building orientation + façade side set the façade azimuth.</li>
<li>Façade frame (t, w, n): t horizontal along the façade (to the right seen from outside), w up the façade plane, n outward normal. Origin at the façade base centre on the outer wall face; glazing at n = −reveal.</li>
<li>Incidence angle θ = acos(ŝ·n̂). Horizontal shadow angle HSA = −atan2(ŝ·t̂, ŝ·n̂) (= solar az − façade az for vertical façades). Vertical shadow (profile) angle VSA = atan2(ŝ·ŵ, ŝ·n̂), so tan VSA = tan(alt)/cos(HSA).</li>
<li>Time: clock time = standard time + DST. UTC = clock − UTC offset − DST. DST rules (EU / US / AU) are applied at day resolution; the transition hour itself is not modelled.</li></ul>
<h3>Solar position</h3>
<p>NOAA Solar Calculator algorithm (Meeus, <i>Astronomical Algorithms</i>): Julian century, geometric mean longitude and anomaly, equation of centre, apparent longitude with nutation correction, obliquity, declination and equation of time; hour angle from true solar time; standard NOAA refraction correction. Sunrise/sunset use a zenith of 90.833° (refraction + solar radius), iterated three times. Stated accuracy ≈ ±0.01° for 1800–2100; validated here against NREL SPA (Reda &amp; Andreas 2004) to &lt; 0.005°.</p>
<h3>Direct-beam shading</h3>
<ol><li>Every shading element (and the window reveal, modelled as wall thickness around the opening) is an oriented box: centre, three orthonormal axes (including blade tilt / fin rotation) and half-sizes.</li>
<li>The 8 vertices of each box are projected along the sun vector onto the glazing plane: P = V − ((V<sub>n</sub> − n<sub>g</sub>)/s<sub>n</sub>)·s. The convex hull of the projections is the exact shadow polygon of that box.</li>
<li>The union of all shadow polygons is clipped to the window rectangle with a scan-line method: exact in the horizontal direction, 200–240 rows vertically (error ≤ 0.5 % of window area). Sunlit fraction = 1 − union area / window area.</li>
<li>Sun below the horizon or behind the façade (s<sub>n</sub> ≤ 0) ⇒ window 100 % shaded from direct beam.</li>
<li>Interior sun patch: for each floor cell (0.10 m) a ray towards the sun is intersected with the glazing plane; the cell is sunlit if the hit lies inside the window and outside all shadow polygons. Penetration depth = furthest sunlit cell from the glazing.</li>
<li>Shading mask: the same engine evaluated over the sky dome (3° × 3°), drawn on the sun-path diagram as window-average shaded fraction.</li></ol>
<p>Blind cut-off tracking uses the analytical condition b·sin(β + φ) ≥ s·cos φ (slat width b, pitch s, profile angle φ), i.e. β = asin(s·cos φ / b) − φ; thickness is then included geometrically.</p>
<h3>Daylight (simplified)</h3>
<p>Daylight factor = sky + externally reflected component (numerical integration through the aperture, CIE overcast sky, obstruction luminance ρ·0.4·E<sub>h</sub>/π) + internally reflected component (BRE split-flux). Distinct from direct sun. Not a validated illuminance simulation.</p>
<h3>Radiation & solar heat gain (estimated)</h3>
<p>Irradiance is never derived from solar position alone. Inputs: manual DNI/DHI/GHI, EPW hourly records, or ASHRAE 2009 clear-sky with user τ<sub>b</sub>, τ<sub>d</sub>. On the glazing: direct = DNI·cosθ·sunlit fraction; sky diffuse = DHI·F<sub>sky</sub>; ground = GHI·ρ<sub>g</sub>·F<sub>gnd</sub> (isotropic Liu–Jordan), with view factors computed by cosine-weighted ray sampling including the shading devices. SHG = A·SHGC·[k(θ)·I<sub>dir</sub> + k(θ<sub>sky</sub>)·I<sub>sky</sub> + k(θ<sub>gnd</sub>)·I<sub>gnd</sub>], k(θ) = 1 − b₀(1/cosθ − 1).</p>
<h3>Limitations</h3>
<ul><li>Single façade bay, one rectangular window; no neighbouring buildings, terrain or self-shading from other building parts.</li>
<li>Shading elements are opaque boxes; perforated / translucent materials, fabric and curved geometry are not modelled. Inter-reflections from devices into the window are excluded from the radiation estimate.</li>
<li>Isotropic diffuse sky for radiation (underestimates circumsolar diffuse; Perez not implemented). Daylight uses CIE overcast only.</li>
<li>Glazing: single angular modifier, no frame, no spectral or layer-by-layer optics; SHG is instantaneous (no thermal mass / time lag) and not a cooling-load calculation.</li>
<li>Interior: horizontal floor behind the façade, no interior reveal or furniture; for tilted façades the room footprint is approximate.</li>
<li>DST at day resolution; EPW hourly values used for every sub-step in that hour; leap day uses 28 Feb records.</li>
<li>Annual floor-hours are a clear-sky geometric potential, not LM-83 ASE; sDA/ASE require Radiance with weather data.</li></ul>
<h3>References</h3>
<ul><li>NOAA Global Monitoring Laboratory, Solar Calculation Details; J. Meeus (1998) Astronomical Algorithms.</li><li>Reda &amp; Andreas (2004) Solar Position Algorithm, NREL/TP-560-34302.</li>
<li>Duffie &amp; Beckman, Solar Engineering of Thermal Processes (isotropic sky, equivalent incidence angles).</li><li>ASHRAE Handbook — Fundamentals (2009–2021), Ch. 14–15.</li>
<li>BRE Digest 309/310; Littlefair, Site Layout Planning for Daylight (split-flux, limiting depth). IES LM-83 (sDA, ASE).</li></ul>` }));
}
