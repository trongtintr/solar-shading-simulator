<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Shading & Daylight Simulator</title>
<!--
  Interactive Solar Shading and Daylighting Simulator — single-file build.
  External dependencies (loaded from jsDelivr CDN, ES modules):
    three@0.160.0  (3D rendering)            https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js
    three@0.160.0/examples/jsm/controls/OrbitControls.js
  Everything else (solar position, shading geometry, daylight, radiation, charts) is implemented below.
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#efede8; --panel:#ffffff; --ink:#1d232a; --muted:#69707a; --line:#dcd8d0; --soft:#f6f5f1;
  --accent:#2f5d8a; --sun:#e9a91b; --trans:#f07a22; --shade:#50627a; --bad:#b4442f; --good:#2f7a4f;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#1f262e;color:#eef1f4}
header h1{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0;white-space:nowrap}
header .loc{font-family:var(--mono);font-size:11.5px;color:#b9c3cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header button{background:#2e3843;color:#e8edf2;border:1px solid #3c4855;border-radius:4px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
header button:hover{background:#3a4654}
main{display:grid;grid-template-columns:330px minmax(380px,1fr) 470px;height:calc(100vh - 48px)}
#left,#right{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
#center{position:relative;min-width:0;display:flex;flex-direction:column}
#view3d{flex:1;position:relative;min-height:300px}
#view3d canvas{display:block;width:100%;height:100%}
#toolbar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px}
#toolbar label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#toolbar select,#toolbar button{font-size:12px}
#statusBar{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;pointer-events:none;max-width:calc(100% - 20px)}
#legend3d{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:11px;pointer-events:none}
#legend3d i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#38414b;background:var(--soft);list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:before{content:"▸";display:inline-block;width:14px;color:var(--muted)}
details.sec[open]>summary:before{content:"▾"}
.secbody{padding:6px 12px 10px}
.row{margin:6px 0}
.row>label{display:flex;justify-content:space-between;font-size:12px;color:#39424c;margin-bottom:2px}
.row>label .u{color:var(--muted);font-family:var(--mono);font-size:11px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl input[type=time]{width:104px;font-family:var(--mono);font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl input[type=number]{width:78px;font-family:var(--mono);font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
select,input[type=date],input[type=text],textarea{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:3px 5px;background:#fff;color:var(--ink)}
.row select,.row input[type=date]{width:100%}
textarea{width:100%;font-family:var(--mono);font-size:11px;min-height:150px}
.hint{font-size:11px;color:var(--muted);margin:4px 0}
.warn{font-size:11.5px;color:var(--bad);margin:4px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--soft)} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:0;z-index:2}
#tabs button{flex:1;border:0;background:none;padding:9px 4px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none;padding:10px 12px 18px}
.pane.on{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#38414b;margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
h3:first-child{margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:6px 7px}
.kpi .k{font-size:10.5px;color:var(--muted);line-height:1.2}
.kpi .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px}
.kpi .v small{font-size:10.5px;font-weight:400;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t td,table.t th{border-bottom:1px solid #ece9e3;padding:3px 4px;text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono)}
table.t th{font-weight:600;color:#47505a;background:var(--soft)}
table.t tr.diff td{background:#fff6dc}
.pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
canvas.chart{width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:#fff;margin:4px 0 8px}
.note{background:#f4f6f8;border-left:3px solid var(--accent);padding:6px 9px;font-size:11.5px;color:#3c4652;margin:8px 0}
.note.est{border-left-color:var(--sun)}
.cfglist .item{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--line);border-radius:4px;margin:4px 0;background:#fff}
.cfglist .item.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cfglist input[type=text]{width:100%}
.cfglist .ty{font-size:10.5px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0}
.prog>div{height:100%;background:var(--accent);width:0}
.method p,.method li{font-size:12px;line-height:1.5}
.method code{font-family:var(--mono);font-size:11px;background:var(--soft);padding:0 3px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1250px){ main{grid-template-columns:300px 1fr;height:auto} #right{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)} #center{height:70vh} #left{max-height:70vh} }
@media (max-width:760px){ main{grid-template-columns:1fr} #left{max-height:none} #center{height:60vh} header .loc{display:none} }
</style>
</head>
<body>
<header>
  <h1>Solar Shading &amp; Daylight Simulator</h1>
  <div class="loc" id="hdrLoc"></div>
  <button id="btnExportParams" title="Parameter table of all configurations (CSV)">Export parameters CSV</button>
  <button id="btnExportTS" title="Time-series from the last period / comparison run (CSV)">Export time-series CSV</button>
  <button id="btnExportRad" title="Radiance scene, sensor grid and run script for the active configuration">Export Radiance</button>
</header>
<main>
  <aside id="left"></aside>
  <section id="center">
    <div id="toolbar"></div>
    <div id="view3d"><div id="legend3d"></div><div id="statusBar"></div></div>
  </section>
  <aside id="right">
    <nav id="tabs"></nav>
    <div id="panes"></div>
  </aside>
</main>
<script type="module">
/*__CODE__*/
</script>
</body>
</html>
