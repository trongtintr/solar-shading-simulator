name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validation suite
        run: npm test
      - name: Build and verify index.html is up to date
        run: |
          npm run build
          git diff --exit-code index.html || (echo "::error::index.html is stale — run 'npm run build' and commit." && exit 1)
